name: macOS Release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# PR verification can cancel in-progress runs. Real releases are serialized so
# two publishes cannot assign the same YYYY.M.D.N.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Decide packaging mode
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.decide.outputs.package }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Classify pull request vs real release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            echo "PR/test run: sign and notarize only; do not assign date.build or publish."
            echo "package=1" >> "${GITHUB_OUTPUT}"
            echo "release=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "workflow_dispatch: assign next America/Chicago date.build and publish."
            echo "package=1" >> "${GITHUB_OUTPUT}"
            echo "release=1" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            if gh release view "${REF_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1; then
              echo "Tag ${REF_NAME} already has a GitHub release; skipping the tag-triggered rebuild."
              echo "package=0" >> "${GITHUB_OUTPUT}"
              echo "release=0" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "Tag ${REF_NAME} has no release yet; package that version and publish."
            echo "package=1" >> "${GITHUB_OUTPUT}"
            echo "release=1" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "Unsupported event ${EVENT_NAME}; skipping."
          echo "package=0" >> "${GITHUB_OUTPUT}"
          echo "release=0" >> "${GITHUB_OUTPUT}"

  build-macos:
    name: Sign, notarize, and staple
    needs: gate
    if: needs.gate.outputs.package == '1'
    runs-on: macos-15
    outputs:
      app_version: ${{ steps.package.outputs.app_version }}
      arch: ${{ steps.package.outputs.arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify packaging helpers
        run: |
          python3 scripts/next-date-build-version.py --self-test
          python3 scripts/verify-mediakit-vlckit-load.py --self-test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/import-apple-signing-cert.sh

      - name: Build, sign, notarize, and staple
        id: package
        env:
          MACOS_CODESIGN_IDENTITY: "Developer ID Application: BRANDON BROWNING STONE (K6N4J68LTY)"
          MACOS_REQUIRE_NOTARIZATION: "1"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MATRIXCLIENT_RELEASE: ${{ needs.gate.outputs.release }}
          MATRIXCLIENT_VERSION: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          MATRIXCLIENT_VERSION_DEBUG: "1"
        run: ./scripts/package-macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MatrixClient-${{ steps.package.outputs.app_version }}-macos-${{ steps.package.outputs.arch }}
          path: |
            build/MatrixClient-${{ steps.package.outputs.app_version }}-macos-${{ steps.package.outputs.arch }}.zip
            build/MatrixClient-${{ steps.package.outputs.app_version }}-macos-${{ steps.package.outputs.arch }}.dmg
            build/SHA256SUMS
          if-no-files-found: error

      - name: Delete signing keychain
        if: always()
        run: |
          if [[ -n "${MACOS_SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${MACOS_SIGNING_KEYCHAIN_PATH}" || true
          fi
          rm -f "${MACOS_SIGNING_CERTIFICATE_PATH:-}"

  publish-release:
    name: Publish GitHub release
    if: needs.gate.outputs.release == '1'
    needs:
      - gate
      - build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v5
        with:
          name: MatrixClient-${{ needs.build-macos.outputs.app_version }}-macos-${{ needs.build-macos.outputs.arch }}
          path: release-artifacts/macos

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build-macos.outputs.app_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ ! "${APP_VERSION}" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])\.[1-9][0-9]*$ ]]; then
            echo "Refusing to publish non-release version ${APP_VERSION}" >&2
            exit 1
          fi
          tag="v${APP_VERSION}"
          title="MatrixClient ${APP_VERSION}"
          notes="Developer ID-signed and notarized macOS build for ${APP_VERSION}."
          mapfile -d '' assets < <(find release-artifacts -type f -print0)
          if gh release view "${tag}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; refusing to clobber." >&2
            exit 1
          fi
          if gh api --silent "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo "Tag ${tag} already exists; refusing to reuse N from workflow_dispatch." >&2
              exit 1
            fi
          fi
          gh release create "${tag}" --repo "${GH_REPO}" "${assets[@]}" --title "${title}" --notes "${notes}" --latest --target "${GITHUB_SHA}"
