name: MatrixClient
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_OBJC_ARC: YES
packages:
  MatrixRustSDK:
    url: https://github.com/matrix-org/matrix-rust-components-swift.git
    branch: main
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.9.0
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm.git
    exactVersion: 3.6.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.6
targets:
  MatrixClient:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/MatrixClientApp
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: AppShell
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonstone.MatrixClient
        INFOPLIST_FILE: Config/MatrixClient-Info.plist
        PRODUCT_NAME: MatrixClient
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/MatrixClient.entitlements
        DEVELOPMENT_TEAM: K6N4J68LTY
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AppShell:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/AppShell
    dependencies:
      - target: MatrixCore
      - target: TimelineUI
      - target: MediaKit
      - target: Persistence
      - target: Diagnostics
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonstone.MatrixClient.AppShell
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  MatrixCore:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      # Directory globs include every Swift file. CodeQL autobuild does not run
      # xcodegen, so new files must also be listed in MatrixClient.xcodeproj.
      - Sources/MatrixCore
    dependencies:
      - target: Persistence
      - target: Diagnostics
      - package: MatrixRustSDK
        product: MatrixRustSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonstone.MatrixClient.MatrixCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  TimelineUI:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/TimelineUI
    dependencies:
      - target: MatrixCore
      - target: MediaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonstone.MatrixClient.TimelineUI
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  MediaKit:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/MediaKit
    dependencies:
      - target: Diagnostics
      - package: VLCKitSPM
        product: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonstone.MatrixClient.MediaKit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          - "@loader_path/Frameworks"
  Persistence:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/Persistence
    dependencies:
      - target: Diagnostics
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonstone.MatrixClient.Persistence
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  Diagnostics:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/Diagnostics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonstone.MatrixClient.Diagnostics
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  MatrixLiveSmoke:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/MatrixLiveSmoke
    dependencies:
      - target: MatrixCore
      - target: Persistence
      - target: Diagnostics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonstone.MatrixClient.MatrixLiveSmoke
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: MatrixLiveSmoke
        SKIP_INSTALL: YES
  MatrixCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      # Directory globs include every Swift file. CodeQL autobuild does not run
      # xcodegen, so new files must also be listed in MatrixClient.xcodeproj.
      - Tests/MatrixCoreTests
    dependencies:
      - target: MatrixCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PersistenceTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests/PersistenceTests
    dependencies:
      - target: Persistence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AppShellTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests/AppShellTests
    dependencies:
      - target: AppShell
      - target: MatrixCore
      - target: MediaKit
      - target: Diagnostics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MatrixClient:
    build:
      targets:
        MatrixClient: all
    test:
      targets:
        - MatrixCoreTests
        - PersistenceTests
        - AppShellTests
  MatrixLiveSmoke:
    build:
      targets:
        MatrixLiveSmoke: all
